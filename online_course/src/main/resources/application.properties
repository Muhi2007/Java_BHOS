spring.application.name=online_course

# Turns on the web viewer
spring.h2.console.enabled=true

# Sets the path to access it (this is the default)
spring.h2.console.path=/h2-console

# Tells Spring to give your database a predictable name instead of a random one
spring.datasource.url=jdbc:h2:mem:coursedb
spring.datasource.username=sa
spring.datasource.password=