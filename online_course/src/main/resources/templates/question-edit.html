<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Question - Learnify</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white border-0 pt-4 px-4">
                    <h2 class="h4 mb-1 fw-bold">Edit Question</h2>
                    <p class="text-muted mb-0">Update the question details for this quiz.</p>
                </div>

                <div class="card-body px-4 pb-4">
                    <form th:action="@{/course/{courseId}/quiz/{quizId}/question/{questionId}/edit(courseId=${courseId}, quizId=${quizId}, questionId=${question.id})}"
                          th:object="${question}" method="post">
                        <div class="mb-3">
                            <label for="text" class="form-label fw-semibold">Question Text</label>
                            <textarea id="text" class="form-control" th:field="*{text}" rows="3" required></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="option1" class="form-label fw-semibold">Option 1</label>
                            <input id="option1" type="text" class="form-control" th:field="*{options[0]}" required>
                        </div>

                        <div class="mb-3">
                            <label for="option2" class="form-label fw-semibold">Option 2</label>
                            <input id="option2" type="text" class="form-control" th:field="*{options[1]}" required>
                        </div>

                        <div class="mb-3">
                            <label for="option3" class="form-label fw-semibold">Option 3</label>
                            <input id="option3" type="text" class="form-control" th:field="*{options[2]}" required>
                        </div>

                        <div class="mb-3">
                            <label for="option4" class="form-label fw-semibold">Option 4</label>
                            <input id="option4" type="text" class="form-control" th:field="*{options[3]}" required>
                        </div>

                        <div class="mb-4">
                            <label for="correctAnswer" class="form-label fw-semibold">Correct Answer</label>
                            <input id="correctAnswer" type="text" class="form-control" th:field="*{correctAnswer}" required>
                        </div>

                        <div class="d-flex gap-2 justify-content-end">
                            <a th:href="@{/course/{courseId}/quiz/{quizId}/questions(courseId=${courseId}, quizId=${quizId})}"
                               class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary">Save Changes</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
