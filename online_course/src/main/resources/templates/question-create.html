<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Question – Learnify</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body style="background: var(--bg);">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-7">

            <!-- Back link -->
            <a th:href="@{/course/{cId}/quiz/{qId}/questions(cId=${courseId}, qId=${quizId})}" class="d-inline-flex align-items-center gap-2 mb-4 text-decoration-none"
               style="color:#94a3b8; font-size:.86rem; font-weight:500;">
                <i class="bi bi-arrow-left"></i> Back to Questions
            </a>

            <div class="card shadow-sm border-0">
                <!-- Card header -->
                <div class="p-4 pb-2 border-bottom" style="background: linear-gradient(135deg, #f5f3ff, #fff); border-radius: var(--card-radius) var(--card-radius) 0 0;">
                    <div class="d-flex align-items-center gap-3">
                        <div class="stat-icon bg-purple-light flex-shrink-0">
                            <i class="bi bi-plus-circle text-primary" style="font-size:1.2rem;"></i>
                        </div>
                        <div>
                            <h2 class="h5 mb-0 fw-bold">Create Question</h2>
                            <p class="text-muted small mb-0">Add a new question to this quiz.</p>
                        </div>
                    </div>
                </div>

                <div class="card-body p-4">
                    <form th:action="@{/course/{cId}/quiz/{qId}/create-question(cId=${courseId}, qId=${quizId})}"
                          th:object="${question}" method="post">

                        <div class="mb-4">
                            <label for="text" class="form-label">QUESTION TEXT</label>
                            <textarea id="text" class="form-control" th:field="*{text}" rows="3" required></textarea>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label for="option1" class="form-label">OPTION A (1)</label>
                                <input id="option1" type="text" class="form-control" th:field="*{options[0]}" required>
                            </div>
                            <div class="col-md-6">
                                <label for="option2" class="form-label">OPTION B (2)</label>
                                <input id="option2" type="text" class="form-control" th:field="*{options[1]}" required>
                            </div>
                            <div class="col-md-6">
                                <label for="option3" class="form-label">OPTION C (3)</label>
                                <input id="option3" type="text" class="form-control" th:field="*{options[2]}" required>
                            </div>
                            <div class="col-md-6">
                                <label for="option4" class="form-label">OPTION D (4)</label>
                                <input id="option4" type="text" class="form-control" th:field="*{options[3]}" required>
                            </div>
                        </div>

                        <div class="mb-5">
                            <label for="correctAnswer" class="form-label">CORRECT ANSWER</label>
                            <div class="input-group">
                                <span class="input-group-text bg-success-subtle border-success-subtle text-success"><i class="bi bi-check2-circle"></i></span>
                                <input id="correctAnswer" type="text" class="form-control border-success-subtle" th:field="*{correctAnswer}"
                                       placeholder="Must perfectly match one of the options above" required>
                            </div>
                        </div>

                        <div class="d-flex gap-3 justify-content-end pt-3 border-top">
                            <a th:href="@{/course/{cId}/quiz/{qId}/questions(cId=${courseId}, qId=${quizId})}" class="btn btn-outline-secondary" id="cancel-question-btn">
                                <i class="bi bi-x-circle me-1"></i>Cancel
                            </a>
                            <button type="submit" class="btn btn-primary px-4" id="save-question-btn">
                                <i class="bi bi-check2-circle me-1"></i>Add Question
                            </button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
