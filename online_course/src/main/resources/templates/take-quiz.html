<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${quiz.name} + ' – Learnify'">Quiz – Learnify</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        /* Progress tracker pill */
        .quiz-progress-bar {
            height: 6px;
            border-radius: 3px;
            background: rgba(255,255,255,.25);
            overflow: hidden;
        }
        .quiz-progress-fill {
            height: 100%;
            border-radius: 3px;
            background: rgba(255,255,255,.9);
            transition: width .4s ease;
        }
    </style>
</head>
<body class="quiz-body">
<div id="wrapper">

    <!-- ── Sidebar ─────────────────────────────────────── -->
    <div id="sidebar-wrapper">
        <div class="sidebar-heading">
            <i class="bi bi-mortarboard-fill"></i> Learnify
        </div>
        <div class="list-group list-group-flush">
            <a href="/learner/dashboard" class="list-group-item-sidebar" id="nav-dashboard">
                <i class="bi bi-grid-1x2"></i> Dashboard
            </a>
            <a href="/learner/my-courses" class="list-group-item-sidebar active" id="nav-my-courses">
                <i class="bi bi-book"></i> My Courses
            </a>
            <a href="#" class="list-group-item-sidebar" id="nav-discover">
                <i class="bi bi-compass"></i> Discover
            </a>
            <div class="sidebar-section-label">Account</div>
            <a href="/logout" class="list-group-item-sidebar text-danger" id="nav-logout">
                <i class="bi bi-box-arrow-right"></i> Log Out
            </a>
        </div>
    </div>

    <!-- ── Page Content ──────────────────────────────── -->
    <div id="page-content-wrapper">

        <!-- Header -->
        <header class="top-header">
            <div class="flex-grow-1 px-1">
                <div class="d-flex align-items-center gap-2" style="font-size:.86rem;">
                    <i class="bi bi-patch-question-fill text-primary"></i>
                    <span style="color:#94a3b8;">Quiz</span>
                    <span style="color:#c4b5fd;">/</span>
                    <span class="fw-semibold" th:text="${quiz.name}">Quiz Name</span>
                </div>
            </div>
            <div class="user-actions">
                <a href="/learner/my-courses" class="btn btn-sm btn-outline-secondary" id="exit-quiz-btn">
                    <i class="bi bi-x-lg me-1"></i>Exit Quiz
                </a>
            </div>
        </header>

        <main class="p-4">
            <div class="row justify-content-center">
                <div class="col-12 col-lg-8 col-xl-7">

                    <!-- Quiz header card -->
                    <div class="card border-0 mb-4 p-4 quiz-header-card">
                        <div class="d-flex justify-content-between align-items-start">
                            <div class="flex-grow-1">
                                <h2 class="fw-bold mb-1" th:text="${quiz.name}">Quiz Name</h2>
                                <p class="mb-3" style="color:rgba(255,255,255,.75); font-size:.88rem;">
                                    <i class="bi bi-list-ol me-1"></i>
                                    <span th:text="${quiz.questions != null ? quiz.questions.size() : 0}">0</span> questions
                                    &nbsp;·&nbsp;
                                    <i class="bi bi-trophy me-1"></i>Max score: <span th:text="${quiz.maxScore}">0</span> pts
                                </p>
                                <!-- Progress bar -->
                                <div class="quiz-progress-bar" style="max-width: 300px;">
                                    <div class="quiz-progress-fill" id="quiz-progress" style="width: 0%;"></div>
                                </div>
                                <p class="mt-1 mb-0" style="font-size:.75rem; color:rgba(255,255,255,.6);">
                                    <span id="answered-count">0</span> of
                                    <span th:text="${quiz.questions != null ? quiz.questions.size() : 0}">0</span> answered
                                </p>
                            </div>
                            <span class="quiz-difficulty-badge ms-3"
                                  th:classappend="${quiz.difficulty == 'Easy'} ? 'badge-easy' : (${quiz.difficulty == 'Medium'} ? 'badge-medium' : 'badge-hard')"
                                  th:text="${quiz.difficulty}">Easy</span>
                        </div>
                    </div>

                    <!-- ── Question Form ────────────────────────── -->
                    <form th:action="@{/quiz/{id}/submit(id=${attemptID})}" method="post" id="quiz-form">

                        <div th:each="question, qStat : ${quiz.questions}" class="question-card mb-4">
                            <!-- Question header -->
                            <div class="question-number">
                                Question <span th:text="${qStat.index + 1}">1</span>
                                <span style="color:#c4b5fd; font-weight:500;">
                                    / <span th:text="${quiz.questions.size()}">n</span>
                                </span>
                            </div>
                            <p class="question-text" th:text="${question.text}">Question text goes here.</p>

                            <!-- Answer options -->
                            <div class="options-list">
                                <label th:each="option, oStat : ${question.options}"
                                       class="option-label"
                                       th:for="${'q' + qStat.index + '_o' + oStat.index}">
                                    <input type="radio"
                                           th:id="${'q' + qStat.index + '_o' + oStat.index}"
                                           th:name="${qStat.index}"
                                           th:value="${option}"
                                           class="option-radio">
                                    <span class="option-marker">
                                        <span th:text="${oStat.index == 0 ? 'A' : (oStat.index == 1 ? 'B' : (oStat.index == 2 ? 'C' : 'D'))}">A</span>
                                    </span>
                                    <span class="option-text" th:text="${option}">Option</span>
                                </label>
                            </div>
                        </div>

                        <!-- Submit  -->
                        <div class="card border-0 p-4 d-flex flex-row justify-content-between align-items-center gap-3 mb-5"
                             style="background: #fff;">
                            <a href="/learner/my-courses" class="btn btn-outline-secondary px-4" id="back-btn">
                                <i class="bi bi-arrow-left me-1"></i>Back
                            </a>
                            <button type="submit" class="btn btn-primary px-5 fw-semibold" id="submit-quiz-btn">
                                <i class="bi bi-send-check me-2"></i>Submit Quiz
                            </button>
                        </div>
                    </form>

                </div>
            </div>
        </main>
    </div>
</div>

<script>
    const totalQuestions = document.querySelectorAll('.question-card').length;
    const progressBar    = document.getElementById('quiz-progress');
    const answeredLabel  = document.getElementById('answered-count');

    function updateProgress() {
        const answered = new Set(
            [...document.querySelectorAll('.option-radio:checked')].map(r => r.name)
        ).size;
        answeredLabel.textContent = answered;
        progressBar.style.width = (totalQuestions > 0 ? (answered / totalQuestions) * 100 : 0) + '%';
    }

    // Highlight selected option card
    document.querySelectorAll('.option-radio').forEach(radio => {
        radio.addEventListener('change', function () {
            const name = this.name;
            document.querySelectorAll(`input[name="${name}"]`).forEach(r => {
                r.closest('.option-label').classList.remove('selected');
            });
            this.closest('.option-label').classList.add('selected');
            updateProgress();
        });
    });

    // Confirm before submit
    document.getElementById('quiz-form').addEventListener('submit', function (e) {
        const answered = new Set(
            [...document.querySelectorAll('.option-radio:checked')].map(r => r.name)
        ).size;
        if (answered < totalQuestions) {
            if (!confirm(`You have answered ${answered} of ${totalQuestions} questions. Submit anyway?`)) {
                e.preventDefault();
            }
        }
    });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
