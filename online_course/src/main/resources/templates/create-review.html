<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Review - Learnify</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white border-0 pt-4 px-4">
                    <h2 class="h4 mb-1 fw-bold">Add Review</h2>
                    <p class="text-muted mb-0">Share your feedback and rate this course.</p>
                </div>

                <div class="card-body px-4 pb-4">
                    <form th:action="@{/course/{courseId}/add-review(courseId=${courseId})}"
                          th:object="${review}" method="post">
                        <div class="mb-4">
                            <label class="form-label fw-semibold d-block">Rating</label>
                            <div class="p-3 rounded-custom border bg-white review-rating-card">
                                <div class="review-stars" aria-hidden="true">
                                    <span class="review-stars-bg">★★★★★</span>
                                    <span class="review-stars-fill" id="reviewStarsFill">★★★★★</span>
                                </div>

                                <input id="score" class="form-range review-score-slider" type="range"
                                       min="1" max="5" step="0.5" th:field="*{score}" required
                                       aria-label="Course rating slider from 1 to 5">

                                <div class="small text-muted">
                                    Selected: <span id="reviewScoreValue">5.0</span>/5
                                </div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="comment" class="form-label fw-semibold">Comment</label>
                            <textarea id="comment" class="form-control" th:field="*{comment}" rows="5"
                                      placeholder="Tell others what you liked and what could be better..."></textarea>
                        </div>

                        <div class="d-flex gap-2 justify-content-end">
                            <a th:href="@{/course/{courseId}(courseId=${courseId})}" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-send-check me-1"></i>Post Review
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        const slider = document.getElementById('score');
        const starsFill = document.getElementById('reviewStarsFill');
        const scoreText = document.getElementById('reviewScoreValue');

        if (!slider) {
            return;
        }

        function syncRatingView() {
            const value = Number(slider.value);
            const percent = Math.min(100, Math.max(0, (value / 5) * 100));

            if (starsFill) {
                starsFill.style.width = percent + '%';
            }

            if (scoreText) {
                scoreText.textContent = value.toFixed(1);
            }
        }

        if (!slider.value || Number(slider.value) < 1) {
            slider.value = '5';
        }

        slider.addEventListener('input', syncRatingView);
        slider.addEventListener('change', syncRatingView);
        syncRatingView();
    })();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
