<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Review – Learnify</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body style="background: var(--bg);">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-7">

            <!-- Back link -->
            <a th:href="@{/course/{courseId}(courseId=${courseId})}" class="d-inline-flex align-items-center gap-2 mb-4 text-decoration-none"
               style="color:#94a3b8; font-size:.86rem; font-weight:500;">
                <i class="bi bi-arrow-left"></i> Back to Course
            </a>

            <div class="card shadow-sm border-0">
                <!-- Card header -->
                <div class="p-4 pb-2 border-bottom" style="background: linear-gradient(135deg, #fef3c7, #fff); border-radius: var(--card-radius) var(--card-radius) 0 0;">
                    <div class="d-flex align-items-center gap-3">
                        <div class="stat-icon bg-orange-light flex-shrink-0">
                            <i class="bi bi-star-half text-warning" style="color:#d97706 !important; font-size:1.25rem;"></i>
                        </div>
                        <div>
                            <h2 class="h5 mb-0 fw-bold">Add Review</h2>
                            <p class="text-muted small mb-0">Share your feedback and rate this course.</p>
                        </div>
                    </div>
                </div>

                <div class="card-body p-4">
                    <form th:action="@{/course/{courseId}/add-review(courseId=${courseId})}" th:object="${review}" method="post">

                        <div class="mb-5">
                            <label class="form-label d-block text-center mb-3">OVERALL RATING</label>
                            <div class="p-4 rounded-custom border text-center review-rating-card mx-auto" style="max-width: 400px;">
                                <div class="review-stars mx-auto" aria-hidden="true" style="font-size: 2.8rem; letter-spacing: .25rem; margin-bottom: 1rem;">
                                    <span class="review-stars-bg">★★★★★</span>
                                    <span class="review-stars-fill" id="reviewStarsFill">★★★★★</span>
                                </div>

                                <input id="score" class="form-range review-score-slider w-100" type="range"
                                       min="1" max="5" step="0.5" th:field="*{score}" required
                                       aria-label="Course rating slider from 1 to 5">

                                <div class="fw-bold mt-2" style="font-size:1.1rem; color:var(--text);">
                                    <span id="reviewScoreValue" style="color:#d97706; font-size:1.25rem;">5.0</span> / 5.0
                                </div>
                            </div>
                        </div>

                        <div class="mb-5">
                            <label for="comment" class="form-label">YOUR REVIEW</label>
                            <textarea id="comment" class="form-control" th:field="*{comment}" rows="5"
                                      placeholder="Tell others what you liked and what could be better about this course..."></textarea>
                        </div>

                        <div class="d-flex gap-3 justify-content-end pt-3 border-top">
                            <a th:href="@{/course/{courseId}(courseId=${courseId})}" class="btn btn-outline-secondary" id="cancel-review-btn">
                                <i class="bi bi-x-circle me-1"></i>Cancel
                            </a>
                            <button type="submit" class="btn btn-primary px-4" id="submit-review-btn">
                                <i class="bi bi-send-check me-1"></i>Post Review
                            </button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
    (function() {
        const slider = document.getElementById('score');
        const starsFill = document.getElementById('reviewStarsFill');
        const scoreText = document.getElementById('reviewScoreValue');

        if (!slider) return;

        function syncRatingView() {
            const value = Number(slider.value);
            const percent = Math.min(100, Math.max(0, (value / 5) * 100));
            if (starsFill) starsFill.style.width = percent + '%';
            if (scoreText) scoreText.textContent = value.toFixed(1);
        }

        if (!slider.value || Number(slider.value) < 1) slider.value = '5';

        slider.addEventListener('input', syncRatingView);
        slider.addEventListener('change', syncRatingView);
        syncRatingView();
    })();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
