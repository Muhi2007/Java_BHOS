<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Result - Learnify</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="wrapper">

    <!-- ── Sidebar ─────────────────────────────────────── -->
    <div id="sidebar-wrapper">
        <div class="sidebar-heading border-bottom">
            <i class="bi bi-mortarboard-fill"></i> Learnify
        </div>
        <div class="list-group list-group-flush mt-3">
            <a href="/learner/dashboard" class="list-group-item-sidebar">
                <i class="bi bi-grid-1x2"></i> Dashboard
            </a>
            <a href="/learner/my-courses" class="list-group-item-sidebar active">
                <i class="bi bi-book"></i> My Courses
            </a>
            <div class="sidebar-section-label">Account</div>
            <a href="/logout" class="list-group-item-sidebar text-danger">
                <i class="bi bi-box-arrow-right"></i> Log Out
            </a>
        </div>
    </div>

    <!-- ── Page Content ──────────────────────────────── -->
    <div id="page-content-wrapper">

        <header class="top-header">
            <div class="flex-grow-1 px-2">
                <span class="fw-semibold small text-muted">Quiz Result</span>
            </div>
        </header>

        <main class="p-4">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">

                    <!-- Result card -->
                    <div class="card border-0 text-center p-5 result-card">

                        <!-- Pass / Fail icon -->
                        <div class="result-icon-wrap mx-auto mb-4"
                             th:classappend="${passed} ? 'result-pass' : 'result-fail'">
                            <i class="bi" th:classappend="${passed} ? 'bi-trophy-fill' : 'bi-x-circle-fill'"></i>
                        </div>

                        <h2 class="fw-bold mb-1" th:text="${passed} ? 'Well Done!' : 'Keep Practicing!'">Result</h2>
                        <p class="text-muted mb-4" th:text="${quiz.name}">Quiz Name</p>

                        <!-- Score display -->
                        <div class="score-display mb-4">
                            <div class="score-number" th:text="${#numbers.formatDecimal(attempt.score, 1, 1)}">0.0</div>
                            <div class="score-max text-muted">/ <span th:text="${quiz.maxScore}">10</span> pts</div>
                        </div>

                        <!-- Stats row -->
                        <div class="row g-3 mb-5">
                            <div class="col-4">
                                <div class="result-stat">
                                    <div class="result-stat-value text-primary" th:text="${totalQuestions}">0</div>
                                    <div class="result-stat-label">Total</div>
                                </div>
                            </div>
                            <div class="col-4">
                                <div class="result-stat">
                                    <div class="result-stat-value text-success" th:text="${correctCount}">0</div>
                                    <div class="result-stat-label">Correct</div>
                                </div>
                            </div>
                            <div class="col-4">
                                <div class="result-stat">
                                    <div class="result-stat-value text-danger" th:text="${totalQuestions - correctCount}">0</div>
                                    <div class="result-stat-label">Incorrect</div>
                                </div>
                            </div>
                        </div>

                        <!-- Progress bar -->
                        <div class="mb-5">
                            <div class="d-flex justify-content-between small text-muted mb-1">
                                <span>Score</span>
                                <span th:text="${quiz.maxScore > 0 ? #numbers.formatDecimal(attempt.score / quiz.maxScore * 100, 1, 0) + '%' : '0%'}">0%</span>
                            </div>
                            <div class="progress progress-container">
                                <div class="progress-bar"
                                     th:classappend="${passed} ? 'bg-success' : 'bg-danger'"
                                     role="progressbar"
                                     th:style="'width: ' + (${quiz.maxScore > 0 ? attempt.score / quiz.maxScore * 100 : 0}) + '%'"></div>
                            </div>
                        </div>

                        <!-- Action buttons -->
                        <div class="d-flex flex-column flex-sm-row gap-3 justify-content-center">
                            <a th:href="@{/quiz/{id}/start(id=${quizId})}"
                               class="btn btn-outline-primary px-4 fw-medium">
                                <i class="bi bi-arrow-clockwise me-1"></i>Retake Quiz
                            </a>
                            <a href="/learner/my-courses" class="btn btn-primary px-4 fw-medium">
                                <i class="bi bi-book me-1"></i>My Courses
                            </a>
                        </div>

                    </div>

                </div>
            </div>
        </main>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
