<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Result – Learnify</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="wrapper">

    <!-- ── Sidebar ─────────────────────────────────────── -->
    <div id="sidebar-wrapper">
        <div class="sidebar-heading">
            <i class="bi bi-mortarboard-fill"></i> Learnify
        </div>
        <div class="list-group list-group-flush">
            <a href="/learner/dashboard" class="list-group-item-sidebar" id="nav-dashboard">
                <i class="bi bi-grid-1x2"></i> Dashboard
            </a>
            <a href="/learner/my-courses" class="list-group-item-sidebar active" id="nav-my-courses">
                <i class="bi bi-book"></i> My Courses
            </a>
            <div class="sidebar-section-label">Account</div>
            <a href="/logout" class="list-group-item-sidebar text-danger" id="nav-logout">
                <i class="bi bi-box-arrow-right"></i> Log Out
            </a>
        </div>
    </div>

    <!-- ── Page Content ──────────────────────────────── -->
    <div id="page-content-wrapper">

        <header class="top-header">
            <div class="flex-grow-1 px-2">
                <span class="fw-semibold" style="font-size:.86rem; color:#94a3b8;">Quiz Result</span>
            </div>
        </header>

        <main class="p-4">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">

                    <!-- Result card -->
                    <div class="card result-card border-0 text-center p-5">

                        <!-- Pass / Fail icon -->
                        <div class="result-icon-wrap mx-auto mb-4"
                             th:classappend="${passed} ? 'result-pass' : 'result-fail'">
                            <i class="bi" th:classappend="${passed} ? 'bi-trophy-fill' : 'bi-x-circle-fill'"></i>
                        </div>

                        <h2 class="fw-bold mb-1" th:text="${passed} ? 'Well Done! 🎉' : 'Keep Practicing!'">Result</h2>
                        <p style="color:#94a3b8; font-size:.9rem;" th:text="${quiz.name}">Quiz Name</p>

                        <!-- Score display -->
                        <div class="score-display mb-4">
                            <div class="score-number" th:text="${#numbers.formatDecimal(attempt.score, 1, 1)}">0.0</div>
                            <div class="score-max">/ <span th:text="${quiz.maxScore}">10</span> pts</div>
                        </div>

                        <!-- Stats row -->
                        <div class="row g-3 mb-4">
                            <div class="col-4">
                                <div class="result-stat">
                                    <div class="result-stat-value" style="color:var(--primary);" th:text="${totalQuestions}">0</div>
                                    <div class="result-stat-label">Total</div>
                                </div>
                            </div>
                            <div class="col-4">
                                <div class="result-stat">
                                    <div class="result-stat-value" style="color:#059669;" th:text="${correctCount}">0</div>
                                    <div class="result-stat-label">Correct</div>
                                </div>
                            </div>
                            <div class="col-4">
                                <div class="result-stat">
                                    <div class="result-stat-value" style="color:#dc2626;" th:text="${totalQuestions - correctCount}">0</div>
                                    <div class="result-stat-label">Incorrect</div>
                                </div>
                            </div>
                        </div>

                        <!-- Progress bar -->
                        <div class="mb-5">
                            <div class="d-flex justify-content-between mb-1" style="font-size:.8rem; color:#94a3b8;">
                                <span>Your Score</span>
                                <span th:text="${quiz.maxScore > 0 ? #numbers.formatDecimal(attempt.score / quiz.maxScore * 100, 1, 0) + '%' : '0%'}">0%</span>
                            </div>
                            <div class="progress" style="height:10px; border-radius:5px; background:#f1f0f8;">
                                <div class="progress-bar"
                                     th:classappend="${passed} ? 'bg-success' : 'bg-danger'"
                                     role="progressbar"
                                     th:style="'width: ' + (${quiz.maxScore > 0 ? attempt.score / quiz.maxScore * 100 : 0}) + '%'"></div>
                            </div>
                        </div>

                        <!-- Passing message badge -->
                        <div class="mb-4">
                            <span class="badge px-3 py-2 fw-semibold rounded-pill"
                                  th:classappend="${passed} ? '' : ''"
                                  th:style="${passed} ? 'background:#d1fae5; color:#065f46; font-size:.82rem;' : 'background:#fee2e2; color:#991b1b; font-size:.82rem;'"
                                  th:text="${passed} ? '✓ Passed! Great work.' : '✗ Below passing threshold.'">
                                Result status
                            </span>
                        </div>

                        <!-- Action buttons -->
                        <div class="d-flex flex-column flex-sm-row gap-3 justify-content-center">
                            <a th:href="@{/quiz/{id}/start(id=${quizId})}"
                               class="btn btn-outline-primary px-4 fw-medium" id="retake-btn">
                                <i class="bi bi-arrow-clockwise me-1"></i>Retake Quiz
                            </a>
                            <a href="/learner/my-courses" class="btn btn-primary px-4 fw-medium" id="my-courses-btn">
                                <i class="bi bi-book me-1"></i>My Courses
                            </a>
                        </div>

                    </div>

                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
