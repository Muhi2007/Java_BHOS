<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Learnify Platform</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">
    <div class="container py-5">
        <div class="row w-100 mx-auto justify-content-center">
            
            <div class="col-12 col-md-10 col-lg-8 col-xl-7">
                <div class="card shadow-md border-0 overflow-hidden">
                    <div class="row g-0">
                        <!-- Branding Side -->
                        <div class="col-md-5 d-none d-md-flex align-items-center justify-content-center auth-side-panel auth-side-login">
                            <div class="text-center px-4 py-5 auth-side-content">
                                <i class="bi bi-mortarboard-fill mb-3" style="font-size: 4rem;"></i>
                                <h3 class="fw-bold">Learnify</h3>
                                <p class="small opacity-75 mt-2">Welcome back to your learning journey. Continue where you left off.</p>
                            </div>
                        </div>

                        <!-- Form Side -->
                        <div class="col-md-7">
                            <div class="card-body p-4 p-md-5">
                                <div class="text-center mb-4 d-md-none">
                                    <i class="bi bi-mortarboard-fill text-primary" style="font-size: 2.5rem;"></i>
                                    <h4 class="fw-bold mt-2">Learnify</h4>
                                </div>
                                <h2 class="fw-bold text-center mb-1 text-md-start">Login</h2>
                                <p class="text-muted text-center text-md-start mb-4">Please sign in to your account</p>

                                <div class="alert alert-danger rounded-custom" th:if="${param.error}" role="alert">
                                    <i class="bi bi-exclamation-triangle-fill me-2"></i> Invalid email or password
                                </div>
                                <div class="alert alert-success rounded-custom" th:if="${param.registered}" role="alert">
                                    <i class="bi bi-check-circle-fill me-2"></i> Account created successfully. Please sign in.
                                </div>

                                <form th:action="@{/login}" method="post">
                                    <div class="mb-4">
                                        <label class="form-label fw-medium text-muted small d-block">LOGIN AS</label>
                                        <div class="role-switch-wrap">
                                            <div class="role-switch" role="radiogroup" aria-label="Select account type">
                                            <input class="role-switch-input" type="radio" name="isLearner" id="loginLearner" value="true" checked>
                                            <label class="role-switch-label" for="loginLearner">
                                                <i class="bi bi-mortarboard me-1"></i>Learner
                                            </label>

                                            <input class="role-switch-input" type="radio" name="isLearner" id="loginTeacher" value="false">
                                            <label class="role-switch-label" for="loginTeacher">
                                                <i class="bi bi-easel2 me-1"></i>Teacher
                                            </label>
                                            </div>
                                            <p class="role-switch-hint mb-0">Use the same role you selected during signup.</p>
                                        </div>
                                    </div>

                                    <div class="mb-3">
                                        <label for="email" class="form-label fw-medium text-muted small">EMAIL ADDRESS</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                                            <input type="email" id="email" name="email" class="form-control border-start-0" placeholder="name@example.com" required>
                                        </div>
                                    </div>

                                    <div class="mb-4">
                                        <div class="d-flex justify-content-between">
                                            <label for="password" class="form-label fw-medium text-muted small">PASSWORD</label>
                                        </div>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                                            <input type="password" id="password" name="password" class="form-control border-start-0" placeholder="Enter your password" required>
                                        </div>
                                    </div>

                                    <button type="submit" class="btn btn-primary w-100 py-2 fs-5 mb-3">Sign In</button>
                                    
                                    <div class="text-center">
                                        <span class="text-muted small">Don't have an account? </span>
                                        <a href="/signup" class="text-decoration-none fw-semibold" style="color: var(--primary-color);">Sign Up</a>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
