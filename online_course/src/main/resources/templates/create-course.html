<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Course - Learnify</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white border-0 pt-4 px-4">
                    <h2 class="h4 mb-1 fw-bold">Create New Course</h2>
                    <p class="text-muted mb-0">Fill in the details below to publish your course draft.</p>
                </div>

                <div class="card-body px-4 pb-4">
                    <form th:action="@{/teacher/create-course}" th:object="${course}" method="post">
                        <div class="mb-3">
                            <label for="name" class="form-label fw-semibold">Course Name</label>
                            <input id="name" type="text" class="form-control" th:field="*{name}" placeholder="Enter course name" required>
                        </div>

                        <div class="mb-3">
                            <label for="category" class="form-label fw-semibold">Category</label>
                            <input id="category" type="text" class="form-control" th:field="*{category}" placeholder="e.g. Programming, Design" required>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label fw-semibold">Description</label>
                            <textarea id="description" class="form-control" th:field="*{description}" rows="4" placeholder="Briefly describe your course" required></textarea>
                        </div>

                        <div class="mb-4">
                            <label for="averageDuration" class="form-label fw-semibold">Average Duration (hours)</label>
                            <input id="averageDuration" type="number" class="form-control" th:field="*{averageDuration}" min="0" step="0.5" placeholder="e.g. 12.5" required>
                        </div>

                        <div class="d-flex gap-2 justify-content-end">
                            <a href="/teacher/dashboard" class="btn btn-outline-secondary">
                                <i class="bi bi-x-circle me-1"></i>Cancel
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check2-circle me-1"></i>Create Course
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
