<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Course – Learnify</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body style="background: var(--bg);">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-7">

            <!-- Back link -->
            <a href="/teacher/dashboard" class="d-inline-flex align-items-center gap-2 mb-4 text-decoration-none"
               style="color:#94a3b8; font-size:.86rem; font-weight:500;">
                <i class="bi bi-arrow-left"></i> Back to Dashboard
            </a>

            <div class="card shadow-sm border-0">
                <!-- Card header -->
                <div class="p-4 pb-2 border-bottom" style="background: linear-gradient(135deg, #f5f3ff, #fff); border-radius: var(--card-radius) var(--card-radius) 0 0;">
                    <div class="d-flex align-items-center gap-3">
                        <div class="stat-icon bg-purple-light flex-shrink-0">
                            <i class="bi bi-journal-plus text-primary" style="font-size:1.2rem;"></i>
                        </div>
                        <div>
                            <h2 class="h5 mb-0 fw-bold">Create New Course</h2>
                            <p class="text-muted small mb-0">Fill in the details below to publish your course draft.</p>
                        </div>
                    </div>
                </div>

                <div class="card-body p-4">
                    <form th:action="@{/teacher/create-course}" th:object="${course}" method="post">

                        <div class="mb-4">
                            <label for="name" class="form-label">COURSE NAME</label>
                            <input id="name" type="text" class="form-control" th:field="*{name}"
                                   placeholder="e.g. Introduction to Python" required>
                        </div>

                        <div class="mb-4">
                            <label for="category" class="form-label">CATEGORY</label>
                            <input id="category" type="text" class="form-control" th:field="*{category}"
                                   placeholder="e.g. Programming, Design, Marketing" required>
                        </div>

                        <div class="mb-4">
                            <label for="description" class="form-label">DESCRIPTION</label>
                            <textarea id="description" class="form-control" th:field="*{description}"
                                      rows="4" placeholder="Briefly describe what learners will get from this course..." required></textarea>
                        </div>

                        <div class="mb-5">
                            <label for="averageDuration" class="form-label">AVERAGE DURATION (hours)</label>
                            <input id="averageDuration" type="number" class="form-control" th:field="*{averageDuration}"
                                   min="0" step="0.5" placeholder="e.g. 12.5" required>
                            <div class="form-text" style="font-size:.78rem; color:#94a3b8; margin-top:.35rem;">
                                <i class="bi bi-info-circle me-1"></i>Estimated total hours for a learner to complete this course.
                            </div>
                        </div>

                        <div class="d-flex gap-3 justify-content-end pt-3 border-top">
                            <a href="/teacher/dashboard" class="btn btn-outline-secondary" id="cancel-btn">
                                <i class="bi bi-x-circle me-1"></i>Cancel
                            </a>
                            <button type="submit" class="btn btn-primary px-4" id="create-course-btn">
                                <i class="bi bi-check2-circle me-1"></i>Create Course
                            </button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
