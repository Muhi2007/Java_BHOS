<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Learnify Platform</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">
    <div class="container py-5">
        <div class="row w-100 mx-auto justify-content-center">
            
            <div class="col-12 col-md-10 col-lg-8 col-xl-7">
                <div class="card shadow-md border-0 overflow-hidden">
                    <div class="row g-0 flex-row-reverse">
                        <!-- Branding Side -->
                        <div class="col-md-5 d-none d-md-flex align-items-center justify-content-center auth-side-panel auth-side-signup">
                            <div class="text-center px-4 py-5 auth-side-content">
                                <i class="bi bi-rocket-takeoff-fill mb-3" style="font-size: 3.5rem;"></i>
                                <h3 class="fw-bold">Join Us Today</h3>
                                <p class="small opacity-75 mt-2">Discover new skills, meet expert instructors, and take your career to the next level.</p>
                            </div>
                        </div>

                        <!-- Form Side -->
                        <div class="col-md-7">
                            <div class="card-body p-4 p-md-5">
                                <div class="text-center mb-4 d-md-none">
                                    <i class="bi bi-mortarboard-fill text-primary" style="font-size: 2.5rem;"></i>
                                    <h4 class="fw-bold mt-2">Learnify</h4>
                                </div>
                                <h2 class="fw-bold text-center mb-1 text-md-start">Create Account</h2>
                                <p class="text-muted text-center text-md-start mb-4">Start your learning journey for free</p>

                                <form th:action="@{/signup}" th:object="${learner}" method="post">
                                    <div class="mb-3">
                                        <label for="username" class="form-label fw-medium text-muted small">USERNAME</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                                            <input type="text" id="username" th:field="*{username}" class="form-control border-start-0" placeholder="Choose a username" required>
                                        </div>
                                    </div>

                                    <div class="mb-3">
                                        <label for="email" class="form-label fw-medium text-muted small">EMAIL ADDRESS</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                                            <input type="email" id="email" th:field="*{email}" class="form-control border-start-0" placeholder="name@example.com" required>
                                        </div>
                                    </div>

                                    <div class="mb-4">
                                        <label for="password" class="form-label fw-medium text-muted small">PASSWORD</label>
                                        <div class="input-group">
                                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-shield-lock text-muted"></i></span>
                                            <input type="password" id="password" th:field="*{password}" class="form-control border-start-0" placeholder="Create a password" required>
                                        </div>
                                    </div>

                                    <button type="submit" class="btn btn-primary w-100 py-2 fs-5 mb-3">Sign Up</button>
                                    
                                    <div class="text-center">
                                        <span class="text-muted small">Already have an account? </span>
                                        <a href="/login" class="text-decoration-none fw-semibold" style="color: var(--primary-color);">Log In</a>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
