<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Questions - Learnify</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
            <h2 class="h4 mb-1 fw-bold">Quiz Questions</h2>
            <p class="text-muted mb-0">Review and manage the questions in this quiz.</p>
        </div>
        <a th:href="@{/course/{courseId}/quiz/{quizId}/create-question(courseId=${courseId}, quizId=${quizId})}"
           class="btn btn-primary">Create Question</a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th class="ps-4">Question</th>
                        <th>Correct Answer</th>
                        <th class="text-end pe-4">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(questions)}">
                        <td colspan="3" class="text-center py-5 text-muted">No questions added yet.</td>
                    </tr>
                    <tr th:each="question : ${questions}">
                        <td class="ps-4">
                            <div class="fw-semibold" th:text="${question.text}">Question text</div>
                            <div class="small text-muted mt-1" th:if="${question.options != null and !#lists.isEmpty(question.options)}">
                                Options:
                                <span th:each="opt, stat : ${question.options}">
                                    <span th:text="${opt}">Option</span><span th:if="${!stat.last}">, </span>
                                </span>
                            </div>
                        </td>
                        <td th:text="${question.correctAnswer}">Correct answer</td>
                        <td class="text-end pe-4">
                            <div class="d-inline-flex gap-2">
                                <a th:href="@{/course/{courseId}/quiz/{quizId}/question/{questionId}/edit(courseId=${courseId}, quizId=${quizId}, questionId=${question.id})}"
                                   class="btn btn-sm btn-warning text-dark">Edit</a>
                                <form th:action="@{/course/{courseId}/quiz/{quizId}/question/{questionId}/delete(courseId=${courseId}, quizId=${quizId}, questionId=${question.id})}"
                                      method="post" class="d-inline">
                                    <button type="submit" class="btn btn-sm btn-danger"
                                            onclick="return confirm('Are you sure you want to delete this question?');">Delete</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="mt-4">
        <a th:href="@{/course/{courseId}/quizzes(courseId=${courseId})}" class="btn btn-secondary">Back to Quizzes</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
