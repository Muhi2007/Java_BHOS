<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Quiz - Learnify</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white border-0 pt-4 px-4">
                    <h2 class="h4 mb-1 fw-bold">Create New Quiz</h2>
                    <p class="text-muted mb-0">Create a quiz for this course.</p>
                </div>

                <div class="card-body px-4 pb-4">
                    <form th:action="@{/course/{id}/create-quiz(id=${courseId})}" th:object="${quiz}" method="post">
                        <div class="mb-3">
                            <label for="name" class="form-label fw-semibold">Name</label>
                            <input id="name" type="text" class="form-control" th:field="*{name}" placeholder="Enter quiz name" required>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label fw-semibold">Description</label>
                            <textarea id="description" class="form-control" th:field="*{description}" rows="4" placeholder="Briefly describe this quiz" required></textarea>
                        </div>

                        <div class="mb-4">
                            <label for="maxScore" class="form-label fw-semibold">Max Score</label>
                            <input id="maxScore" type="number" class="form-control" th:field="*{maxScore}" min="0" step="1" required>
                        </div>

                        <div class="mb-4">
                            <label for="difficulty" class="form-label fw-semibold">Difficulty</label>
                            <select id="difficulty" class="form-select" th:field="*{difficulty}" required>
                                <option value="" disabled>Select difficulty</option>
                                <option value="Easy">Easy</option>
                                <option value="Medium">Medium</option>
                                <option value="Hard">Hard</option>
                            </select>
                        </div>

                        <div class="d-flex gap-2 justify-content-end">
                            <a th:href="@{/teacher/dashboard}" href="/teacher/dashboard" class="btn btn-secondary">Cancel</a>
                            <button type="submit" class="btn btn-primary">Create Quiz</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
