<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Quizzes - Learnify</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
            <h2 class="fw-bold mb-1">Course Quizzes</h2>
            <p class="text-muted mb-0">Manage all quizzes attached to this course.</p>
        </div>
        <a th:href="@{/course/{id}/create-quiz(id=${courseId})}" class="btn btn-primary">
            <i class="bi bi-plus-circle me-2"></i>Add New Quiz
        </a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th class="ps-4">Quiz Title</th>
                        <th>Description</th>
                        <th>Max Score</th>
                        <th class="text-end pe-4">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(quizzes)}">
                        <td colspan="4" class="text-center py-5 text-muted">
                            <i class="bi bi-journal-x fs-2 d-block mb-2"></i>
                            No quizzes available for this course yet.
                        </td>
                    </tr>
                    <tr th:each="quiz : ${quizzes}">
                        <td class="ps-4 fw-semibold" th:text="${quiz.name}">Quiz Name</td>
                        <td th:text="${quiz.description}">Quiz description</td>
                        <td>
                            <span class="badge bg-primary-subtle text-primary" th:text="${quiz.maxScore}">0</span>
                        </td>
                        <td class="text-end pe-4">
                            <div class="d-inline-flex gap-2">
                                <a th:href="@{/course/{courseId}/quiz/{quizId}/questions(courseId=${courseId}, quizId=${quiz.id})}"
                                   class="btn btn-sm btn-primary fw-semibold">
                                    <i class="bi bi-pencil-square me-1"></i>Questions
                                </a>
                                <a th:href="@{/course/{cId}/quiz/{qId}/edit(cId=${courseId}, qId=${quiz.id})}"
                                   class="btn btn-sm btn-warning text-dark fw-semibold">
                                    <i class="bi bi-pencil-square me-1"></i>Edit
                                </a>
                                <form th:action="@{/course/{cId}/quiz/{qId}/delete(cId=${courseId}, qId=${quiz.id})}"
                                      method="post" class="d-inline">
                                    <button type="submit" class="btn btn-sm btn-danger fw-semibold"
                                            onclick="return confirm('Are you sure?')">
                                        <i class="bi bi-trash me-1"></i>Delete
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="mt-4">
        <a href="/teacher/dashboard" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-2"></i>Back to Dashboard
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
