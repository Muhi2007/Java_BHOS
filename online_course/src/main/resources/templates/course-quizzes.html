<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Quizzes – Learnify</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body style="background: var(--bg);">
<div class="container py-5">

    <!-- Back link -->
    <a href="/teacher/dashboard" class="d-inline-flex align-items-center gap-2 mb-4 text-decoration-none"
       style="color:#94a3b8; font-size:.86rem; font-weight:500;">
        <i class="bi bi-arrow-left"></i> Back to Dashboard
    </a>

    <!-- Page header -->
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
            <h2 class="fw-bold mb-1" style="font-size:1.5rem;">Course Quizzes</h2>
            <p class="text-muted mb-0" style="font-size:.88rem;">Manage all quizzes attached to this course.</p>
        </div>
        <a th:href="@{/course/{id}/create-quiz(id=${courseId})}" class="btn btn-primary" id="add-quiz-btn">
            <i class="bi bi-plus-circle me-2"></i>Add New Quiz
        </a>
    </div>

    <!-- Table card -->
    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th class="ps-4">Quiz Title</th>
                        <th>Description</th>
                        <th>Difficulty</th>
                        <th>Max Score</th>
                        <th class="text-end pe-4">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(quizzes)}">
                        <td colspan="5" class="text-center py-5">
                            <i class="bi bi-patch-question" style="font-size:2.5rem; color:#ddd4fe;"></i>
                            <p class="text-muted small mt-2 mb-0">No quizzes yet. Add the first quiz to get started.</p>
                        </td>
                    </tr>
                    <tr th:each="quiz : ${quizzes}">
                        <td class="ps-4 fw-semibold" style="font-size:.92rem;" th:text="${quiz.name}">Quiz Name</td>
                        <td style="color:#64748b; font-size:.85rem; max-width:260px;">
                            <span th:text="${quiz.description}">Quiz description</span>
                        </td>
                        <td>
                            <span class="quiz-difficulty-badge"
                                  th:classappend="${quiz.difficulty == 'Easy'} ? 'badge-easy' : (${quiz.difficulty == 'Medium'} ? 'badge-medium' : 'badge-hard')"
                                  th:text="${quiz.difficulty}">Easy</span>
                        </td>
                        <td>
                            <span class="badge fw-semibold"
                                  style="background:var(--primary-light); color:var(--primary); border-radius:50px; font-size:.72rem; padding:.3em .8em;"
                                  th:text="${quiz.maxScore} + ' pts'">0 pts</span>
                        </td>
                        <td class="text-end pe-4">
                            <div class="d-inline-flex gap-2">
                                <a th:href="@{/course/{courseId}/quiz/{quizId}/questions(courseId=${courseId}, quizId=${quiz.id})}"
                                   class="btn btn-sm btn-primary fw-semibold">
                                    <i class="bi bi-list-ul me-1"></i>Questions
                                </a>
                                <a th:href="@{/course/{cId}/quiz/{qId}/edit(cId=${courseId}, qId=${quiz.id})}"
                                   class="btn btn-sm btn-outline-secondary fw-semibold">
                                    <i class="bi bi-pencil me-1"></i>Edit
                                </a>
                                <form th:action="@{/course/{cId}/quiz/{qId}/delete(cId=${courseId}, qId=${quiz.id})}"
                                      method="post" class="d-inline">
                                    <button type="submit" class="btn btn-sm btn-outline-secondary fw-semibold"
                                            style="color:#dc2626; border-color:#fca5a5;"
                                            onclick="return confirm('Delete this quiz? This cannot be undone.')">
                                        <i class="bi bi-trash me-1"></i>Delete
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
